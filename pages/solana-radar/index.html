<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Genesis HQ · Solana Arbitrage Radar</title>
  <style>
    :root{color-scheme:dark;--bg:#0B1020;--panel:#111827;--green:#14F195;--purple:#9945FF;--cyan:#00C2FF;--text:#F8FAFC;--muted:#94A3B8;--red:#EF4444;--amber:#F59E0B}*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 15% 0%,rgba(153,69,255,.18),transparent 35%),radial-gradient(circle at 100% 5%,rgba(20,241,149,.13),transparent 30%),var(--bg);color:var(--text);min-height:100vh}.wrap{max-width:1180px;margin:auto;padding:20px}.top{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:18px}.brand{display:flex;align-items:center;gap:12px}.orb{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--green),var(--purple),var(--cyan));box-shadow:0 0 30px rgba(20,241,149,.25)}h1{font-size:clamp(20px,4vw,32px);margin:0}.sub{color:var(--muted);font-size:13px;margin-top:4px}.badges{display:flex;gap:8px;flex-wrap:wrap}.badge{padding:7px 10px;border-radius:999px;border:1px solid #334155;background:#0F172A;font-size:12px;font-weight:800;letter-spacing:.04em}.green{border-color:rgba(20,241,149,.45);color:var(--green)}.purple{border-color:rgba(153,69,255,.55);color:#C4B5FD}.red{border-color:rgba(239,68,68,.55);color:#FCA5A5}.amber{border-color:rgba(245,158,11,.55);color:#FCD34D}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}.card{grid-column:span 12;background:linear-gradient(180deg,rgba(17,24,39,.95),rgba(10,15,28,.96));border:1px solid #1E293B;border-radius:18px;padding:16px;box-shadow:0 12px 40px rgba(0,0,0,.18)}.half{grid-column:span 6}.third{grid-column:span 4}.label{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.1em;font-weight:800}.value{font-size:22px;font-weight:900;margin-top:6px}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.route{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px}.token{padding:8px 10px;border-radius:10px;background:#0F172A;border:1px solid #243044;font-weight:800}.arrow{color:var(--green);font-weight:900}.costs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:12px}.cost{padding:10px;border:1px solid #243044;border-radius:12px;background:#0F172A}.cost b{float:right}.statusBox{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}.bigStatus{font-size:28px;font-weight:950;letter-spacing:.05em}.reason{color:var(--muted);font-size:13px;max-width:720px;margin-top:6px}.fresh{font-size:12px;color:var(--muted)}.venues{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.venue{padding:7px 9px;border-radius:9px;background:#0B1222;border:1px solid #26354B;color:#CBD5E1;font-size:12px}.error{border-color:rgba(239,68,68,.45);background:rgba(127,29,29,.12)}footer{color:#64748B;font-size:11px;text-align:center;margin:20px 0 8px}.skeleton{opacity:.45;animation:pulse 1.4s ease-in-out infinite}@keyframes pulse{50%{opacity:.75}}@media(max-width:760px){.half,.third{grid-column:span 12}.costs{grid-template-columns:1fr}.wrap{padding:14px}.card{border-radius:15px}}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="top">
      <div class="brand"><div class="orb"></div><div><h1>Arbitrage Radar · Solana</h1><div class="sub">Genesis HQ · evidence-only observability</div></div></div>
      <div class="badges"><span class="badge green">SHADOW / PAPER</span><span class="badge red">LIVE LOCKED</span><span id="freshBadge" class="badge amber">LOADING</span></div>
    </section>

    <section id="root" class="grid skeleton">
      <article class="card"><div class="label">Estado</div><div class="value">Cargando evidencia Solana…</div></article>
    </section>
    <footer>Genesis HQ · Sin wallets · Sin signing · Sin broadcast · Sin capital real</footer>
  </main>
<script>
const SNAP='https://raw.githubusercontent.com/Blackleets/genesis-hq-lab/data/solana-arbitrage-observations/data/solana-arbitrage-latest.json';
const $=s=>document.querySelector(s);
const n=(v,d=4)=>Number.isFinite(Number(v))?Number(v).toFixed(d):'—';
const usd=v=>Number.isFinite(Number(v))?`$${Number(v).toFixed(6)}`:'—';
const txt=v=>v===null||v===undefined||v===''?'—':String(v);
function esc(s){return txt(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function arr(v){return Array.isArray(v)?v:[]}
function statusClass(s){return s==='QUALIFIED'?'green':s==='BLOCKED'?'red':s==='FILTERED'?'amber':'purple'}
function routeLabels(obs){const labels=[];for(const q of [obs?.outboundQuote,obs?.returnQuote])for(const r of arr(q?.routePlan)) {const l=r?.swapInfo?.label||r?.label;if(l&&!labels.includes(l))labels.push(l)}return labels}
async function load(){
  const root=$('#root');
  try{
    const r=await fetch(`${SNAP}?t=${Date.now()}`,{cache:'no-store'}); if(!r.ok) throw new Error(`snapshot HTTP ${r.status}`);
    const s=await r.json(),o=s?.observation||null;
    const valid=s?.mode==='SHADOW'&&s?.executionAuthority===false&&s?.liveLocked===true&&(!o||o?.chain==='SOLANA');
    if(!valid) throw new Error('snapshot contract violation');
    const ts=new Date(o?.observedAt||s?.observedAt||s?.generatedAt||0);const age=Date.now()-ts.getTime();
    $('#freshBadge').textContent=Number.isFinite(age)?(age<45*60*1000?'FRESH':'STALE'):'UNKNOWN';
    $('#freshBadge').className=`badge ${Number.isFinite(age)&&age<45*60*1000?'green':'amber'}`;
    const st=o?.status||s?.status||'OBSERVING',venues=routeLabels(o);
    const c=o?.costs||o?.economics?.costs||{};const econ=o?.economics||o||{};
    const blockers=arr(o?.blockers||s?.blockers);
    root.classList.remove('skeleton');
    root.innerHTML=`
      <article class="card"><div class="statusBox"><div><div class="label">Decision engine</div><div class="bigStatus ${statusClass(st)}">${esc(st)}</div><div class="reason">${blockers.length?blockers.map(esc).join(' · '):'Observación read-only. Ninguna ejecución real está autorizada.'}</div></div><div class="fresh">Observed: ${ts.getTime()?ts.toLocaleString('es-ES'):'—'}</div></div></article>
      <article class="card half"><div class="label">Round-trip route</div><div class="route"><span class="token">USDC</span><span class="arrow">→</span><span class="token">SOL</span><span class="arrow">→</span><span class="token">USDC</span></div><div class="venues">${venues.length?venues.map(v=>`<span class="venue">${esc(v)}</span>`).join(''):'<span class="venue">Sin venue evidence</span>'}</div></article>
      <article class="card half"><div class="label">Quote / slot evidence</div><div class="costs"><div class="cost">Context slot <b class="mono">${esc(o?.contextSlot||o?.outboundQuote?.contextSlot)}</b></div><div class="cost">Return slot <b class="mono">${esc(o?.returnQuote?.contextSlot)}</b></div><div class="cost">Latency ms <b>${n(o?.latencyMs||o?.quoteLatencyMs,0)}</b></div><div class="cost">Input size <b>${n(o?.inputAmountUsd||o?.inputUsd||25,2)} USDC</b></div></div></article>
      <article class="card third"><div class="label">Gross edge</div><div class="value">${n(econ?.grossEdgeBps??o?.grossEdgeBps,4)} bps</div><div class="sub">Before explicit reserves</div></article>
      <article class="card third"><div class="label">Net edge</div><div class="value">${n(econ?.netEdgeBps??o?.netEdgeBps,4)} bps</div><div class="sub">After known/modelled costs</div></article>
      <article class="card third"><div class="label">Net PnL</div><div class="value">${usd(econ?.netPnlUsd??o?.netPnlUsd)}</div><div class="sub">Paper / quote economics only</div></article>
      <article class="card half"><div class="label">Cost reconciliation</div><div class="costs"><div class="cost">Swap / DEX fees <b>${n(c?.swapFeeBps??c?.dexFeeBps??o?.swapFeeBps,4)} bps</b></div><div class="cost">Slippage reserve <b>${n(c?.slippageReserveBps??o?.slippageReserveBps,4)} bps</b></div><div class="cost">Priority fee <b>${txt(c?.priorityFeeLamports??o?.priorityFeeLamports)} lamports</b></div><div class="cost">Jito tip <b>${txt(c?.jitoTipLamports??o?.jitoTipLamports)} lamports</b></div><div class="cost">Failed-attempt reserve <b>${n(c?.failedAttemptCostBps??o?.failedAttemptCostBps,4)} bps</b></div><div class="cost">Safety buffer <b>${n(c?.safetyBufferBps??o?.safetyBufferBps,4)} bps</b></div></div></article>
      <article class="card half"><div class="label">Evidence gates</div><div class="costs"><div class="cost">Atomic simulation <b>${esc(o?.atomicSimulation?.status||o?.atomicSimulationStatus||'—')}</b></div><div class="cost">Capture evidence <b>${esc(o?.captureEvidence?.status||o?.captureEvidenceStatus||'—')}</b></div><div class="cost">Liquidity / depth <b>${esc(o?.liquidityStatus||o?.depthStatus||'—')}</b></div><div class="cost">Viable size <b>${esc(o?.viableSizeUsd||'—')}</b></div></div></article>`;
  }catch(e){root.classList.remove('skeleton');$('#freshBadge').textContent='UNAVAILABLE';$('#freshBadge').className='badge red';root.innerHTML=`<article class="card error"><div class="label">Radar unavailable</div><div class="value">BLOCKED</div><div class="reason">${esc(e.message)}. No se inventan oportunidades ni PnL cuando falta evidencia.</div></article>`}
}
load();setInterval(load,60_000);
</script>
</body></html>
