name: Arbitrage Radar live-chain smoke

on:
  push:
    branches:
      - 'deploy/arbitrage-shadow-railway'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GENESIS_MEV_PUBLIC_RPC_FALLBACK: 'true'
      GENESIS_MEV_RPC_COOLDOWN_CYCLES: '1'
      GENESIS_MEV_SCAN_INTERVAL_MS: '12000'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Read-only Ethereum SHADOW observation
        run: npm run mev:radar:resilient:once
      - name: Diagnose live route economics safely
        run: |
          node --input-type=module <<'NODE'
          import { selectHealthyEthereumRpc } from './server/genesis/mevResilientWorker.mjs';
          import { getMevRadarConfig, scanMevOnchainRadarOnce } from './server/genesis/mevOnchainRadar.mjs';

          const env = {
            ...process.env,
            GENESIS_MEV_RPC_URL: '',
            GENESIS_MEV_RPC_URLS: '',
            GENESIS_MEV_PUBLIC_RPC_FALLBACK: 'true',
          };
          const selected = await selectHealthyEthereumRpc({ env });
          if (!selected.ok) {
            console.log(JSON.stringify({ diagnostic: 'provider_unavailable', attempts: selected.attempts }));
            process.exit(0);
          }

          const config = getMevRadarConfig({ ...env, GENESIS_MEV_RPC_URL: selected.url });
          const result = await scanMevOnchainRadarOnce({ config, persist: false });
          const failures = (result.failures ?? []).map(({ route, error }) => ({
            route,
            error: String(error ?? 'unknown').split('\n')[0].slice(0, 240),
          }));
          const rows = [
            ...(result.evaluation?.candidates ?? []),
            ...(result.evaluation?.rejected ?? []),
          ].map((row) => ({
            route: row.routeId,
            verdict: row.verdict,
            grossPnlUsd: row.grossPnlUsd,
            grossEdgeBps: row.grossEdgeBps,
            totalCostsUsd: row.totalCostsUsd,
            netPnlUsd: row.netPnlUsd,
            netEdgeBps: row.netEdgeBps,
            stressNetPnlUsd: row.stressNetPnlUsd,
            liquidityConfidence: row.liquidityConfidence,
            blockers: row.blockers,
          }));
          console.log(JSON.stringify({
            diagnostic: 'route_economics',
            provider: selected.source,
            block: result.blockNumber ?? null,
            routesScanned: result.routesScanned ?? 0,
            routesQuoted: result.routesQuoted ?? 0,
            liquidityProbesPassed: result.liquidityProbesPassed ?? 0,
            atomicSimulatorConfigured: result.atomicSimulatorConfigured === true,
            qualified: result.evaluation?.candidates?.length ?? 0,
            filtered: result.evaluation?.rejected?.length ?? 0,
            failures,
            rows,
          }));
          NODE
