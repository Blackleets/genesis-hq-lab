name: Solana arbitrage observation
# Manual/push fallback only. Canonical 5m scheduling now runs in Supabase pg_cron.

on:
  workflow_dispatch:
  push:
    branches:
      - feat/genesis-life-os
    paths:
      - '.github/workflows/solana-arbitrage-observation.yml'
      - 'server/genesis/solanaArbitrageObserver.mjs'

permissions:
  contents: write
  id-token: write

concurrency:
  group: solana-arbitrage-observation
  cancel-in-progress: true

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      JUPITER_API_KEY: ${{ secrets.JUPITER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/genesis-life-os
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Capture read-only Solana evidence
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/genesis-solana
          node server/genesis/solanaArbitrageObserver.mjs > /tmp/genesis-solana/solana-arbitrage-latest.json
          observer_exit=$?
          set -e
          echo "observer_exit=$observer_exit" >> "$GITHUB_ENV"
          node -e "const fs=require('fs'); const p='/tmp/genesis-solana/solana-arbitrage-latest.json'; const x=JSON.parse(fs.readFileSync(p,'utf8')); if(x.executionAuthority!==false||x.liveLocked!==true||x.mode!=='SHADOW') throw new Error('safety invariant failed'); if(x.observation&&x.observation.chain!=='SOLANA') throw new Error('wrong chain'); console.log(JSON.stringify({ok:x.ok,status:x.status,error:x.error||null,netPnlUsd:x.observation?.economics?.netPnlUsd??null,netEdgeBps:x.observation?.economics?.netEdgeBps??null,venues:x.observation?.venues??null},null,2));"

      - name: Publish isolated snapshot branch
        shell: bash
        run: |
          git config user.name "genesis-solana-observer"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin data/solana-arbitrage-observations || true
          if git show-ref --verify --quiet refs/remotes/origin/data/solana-arbitrage-observations; then
            git checkout -B data/solana-arbitrage-observations origin/data/solana-arbitrage-observations
          else
            git checkout --orphan data/solana-arbitrage-observations
            git rm -rf .
          fi
          mkdir -p data
          cp /tmp/genesis-solana/solana-arbitrage-latest.json data/solana-arbitrage-latest.json
          node -e "const fs=require('fs'); const p='data/solana-arbitrage-latest.json'; const x=JSON.parse(fs.readFileSync(p,'utf8')); const now=new Date().toISOString(); const historyPath='data/solana-arbitrage-history.json'; let h=[]; try{h=JSON.parse(fs.readFileSync(historyPath,'utf8'))}catch{}; h.push({recordedAt:now,...x}); h=h.slice(-576); fs.writeFileSync(historyPath,JSON.stringify(h,null,2)+'\n'); const eventsPath='data/solana-arbitrage-events.json'; let ev=[]; try{ev=JSON.parse(fs.readFileSync(eventsPath,'utf8'))}catch{}; const next=Array.isArray(x.events)?x.events:[]; for(const event of next){ if(event?.id&&!ev.some(v=>v.id===event.id)) ev.push(event); } ev=ev.slice(-4000); fs.writeFileSync(eventsPath,JSON.stringify(ev,null,2)+'\n');"
          git add data/solana-arbitrage-latest.json data/solana-arbitrage-history.json data/solana-arbitrage-events.json
          if git diff --cached --quiet; then
            echo "No snapshot change"
            exit 0
          fi
          git commit -m "data(solana): periodic arbitrage observation"
          git push origin HEAD:data/solana-arbitrage-observations

      - name: Dispatch qualified Telegram notifications
        shell: bash
        run: |
          set -euo pipefail
          node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/genesis-solana/solana-arbitrage-latest.json','utf8'));fs.writeFileSync('/tmp/genesis-solana/telegram-events.json',JSON.stringify({action:'dispatch',events:x.events||[]}));"
          oidc_response=$(curl --fail-with-body --silent --show-error \
            --header "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=genesis-telegram-dispatch")
          oidc_token=$(printf '%s' "$oidc_response" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const x=JSON.parse(s);if(!x.value)process.exit(2);process.stdout.write(x.value)})")
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${oidc_token}" \
            --header "Content-Type: application/json" \
            --data-binary @/tmp/genesis-solana/telegram-events.json \
            "https://swgixcbwyhxttnmrglbk.supabase.co/functions/v1/genesis-telegram"
