name: Solana objective 1

on:
  push:
    branches:
      - feat/solana-readonly-observer-v1
    paths:
      - 'server/genesis/solanaArbitrageObserver.mjs'
      - 'server/tests/solanaArbitrageObserver.test.mjs'
      - '.github/workflows/solana-objective-1.yml'
  pull_request:
    branches:
      - feat/genesis-life-os
    paths:
      - 'server/genesis/solanaArbitrageObserver.mjs'
      - 'server/tests/solanaArbitrageObserver.test.mjs'
      - '.github/workflows/solana-objective-1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observer-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check server/genesis/solanaArbitrageObserver.mjs
      - name: Read-only observer tests
        run: node --test server/tests/solanaArbitrageObserver.test.mjs
