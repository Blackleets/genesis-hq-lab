name: Solana Radar Pages

on:
  push:
    branches: [feat/genesis-life-os]
    paths:
      - 'pages/solana-radar/**'
      - '.github/workflows/solana-radar-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: solana-radar-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Radar
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages/solana-radar
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
