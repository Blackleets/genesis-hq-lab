name: Deploy to Railway

# Deploys the backend (server + agent + optimizer) to Railway on every push
# to feat/genesis-life-os — the same branch the Vercel frontend tracks, so
# frontend and backend stay in sync.
#
# OPTIONAL: add a GitHub Actions secret named RAILWAY_TOKEN to enable deployment.
#   GitHub → Settings → Secrets and variables → Actions → New repository secret
#   Value: a Railway *project* token (Railway dashboard → project → Settings →
#   Tokens). Without it the workflow reports an explicit SKIP rather than a
#   false code failure.

on:
  push:
    branches: [feat/genesis-life-os]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: railway-deploy
  cancel-in-progress: false

env:
  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Report deployment disabled when RAILWAY_TOKEN is missing
        if: env.RAILWAY_TOKEN == ''
        run: |
          echo "::warning::Railway deployment skipped: RAILWAY_TOKEN is not configured."
          echo "This is an infrastructure configuration state, not a code failure."
          echo "To enable deploys: GitHub → Settings → Secrets and variables → Actions →"
          echo "New repository secret → Name: RAILWAY_TOKEN, Value: <Railway project token>"
          {
            echo "### Railway deployment"
            echo ""
            echo "⏭️ **Skipped** — `RAILWAY_TOKEN` is not configured."
            echo ""
            echo "Code checks may still be healthy; no deployment was attempted."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install Railway CLI
        if: env.RAILWAY_TOKEN != ''
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        if: env.RAILWAY_TOKEN != ''
        run: railway up --detach

      - name: Summarize successful deployment request
        if: env.RAILWAY_TOKEN != ''
        run: |
          {
            echo "### Railway deployment"
            echo ""
            echo "✅ Railway CLI accepted the deployment request."
          } >> "$GITHUB_STEP_SUMMARY"
