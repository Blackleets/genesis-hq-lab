name: Intraday Range Expansion v2 Economics

on:
  push:
    branches:
      - research/intraday-range-expansion-v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  economic-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deterministic research dependencies
        run: python -m pip install --disable-pip-version-check --no-input numpy pandas requests
      - name: Compile research engine
        run: python -m py_compile research/intraday_range_expansion_v2.py
      - name: Record frozen provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence-intraday
          git rev-parse HEAD | tee evidence-intraday/COMMIT_SHA
          sha256sum research/intraday_range_expansion_v2.py research/intraday_range_expansion_v2_manifest.json | tee evidence-intraday/SOURCE_SHA256SUMS
      - name: Run checksum-verified economic screen
        id: econ
        shell: bash
        run: |
          set +e
          python research/intraday_range_expansion_v2.py \
            --manifest research/intraday_range_expansion_v2_manifest.json \
            --out evidence-intraday \
            --workers 12 | tee evidence-intraday/economic_screen.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Hash complete evidence packet
        if: always()
        shell: bash
        run: |
          find evidence-intraday -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum | tee evidence-intraday/SHA256SUMS
      - name: Upload research evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: intraday-range-expansion-v2-economics
          path: evidence-intraday/
          if-no-files-found: error
          retention-days: 30
      - name: Classify economic outcome
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib, sys
          p=pathlib.Path('evidence-intraday/economic_report.json')
          if not p.exists():
              print('ECONOMIC_SCREEN_FATAL no_report')
              sys.exit(3)
          r=json.loads(p.read_text())
          print('ECONOMIC_CLASSIFICATION',r.get('classification'))
          print('ECONOMIC_GATES',json.dumps(r.get('gates'),sort_keys=True))
          print('ECONOMIC_AGGREGATE',json.dumps(r.get('aggregate'),sort_keys=True))
          if r.get('classification') == 'DATA_BLOCKED':
              sys.exit(2)
          if r.get('classification') not in {'PASS_PREFILTER','FAIL_ECONOMICS'}:
              sys.exit(3)
          PY
