name: Keep Backend Awake

# Pings the backend health endpoint every 10 minutes from GitHub's infra.
# Works for both Render and Railway. Configure BACKEND_HEALTH_URL as a
# GitHub Actions variable (repo Settings → Variables → Actions) to point
# at whichever host is active.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-backend-awake
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping backend health endpoint
        run: |
          # Priority: BACKEND_HEALTH_URL var → RAILWAY_HEALTH_URL → legacy Render URL
          URL="${{ vars.BACKEND_HEALTH_URL || vars.RAILWAY_HEALTH_URL || vars.RENDER_HEALTH_URL || 'https://genesis-hq-backend.onrender.com/api/health' }}"
          echo "Pinging $URL"
          for attempt in 1 2 3; do
            if curl --fail --silent --show-error --max-time 30 "$URL"; then
              echo ""
              echo "Healthy on attempt $attempt"
              exit 0
            fi
            echo "Attempt $attempt failed, retrying in 15s..."
            sleep 15
          done
          echo "Backend health endpoint did not respond after 3 attempts — may be deploying"
          exit 0
