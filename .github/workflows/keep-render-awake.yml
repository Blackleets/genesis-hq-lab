name: Keep Backend Awake

# Fires every 10 min from GitHub's infra.
# 1. Pings the backend health endpoint (keeps Railway/Render warm).
# 2. Ticks the Supabase genesis-runner edge function (keeps runner heartbeat
#    fresh so the dashboard never shows RUNNER ESTANCADO due to cron delays).

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-backend-awake
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping backend health endpoint
        run: |
          # Priority: BACKEND_HEALTH_URL var → RAILWAY_HEALTH_URL → legacy Render URL
          URL="${{ vars.BACKEND_HEALTH_URL || vars.RAILWAY_HEALTH_URL || vars.RENDER_HEALTH_URL || 'https://genesis-hq-backend.onrender.com/api/health' }}"
          echo "Pinging $URL"
          for attempt in 1 2 3; do
            if curl --fail --silent --show-error --max-time 30 "$URL"; then
              echo ""
              echo "Healthy on attempt $attempt"
              exit 0
            fi
            echo "Attempt $attempt failed, retrying in 15s..."
            sleep 15
          done
          echo "Backend health endpoint did not respond after 3 attempts — may be deploying"
          exit 0

      - name: Tick genesis-runner (keep heartbeat alive)
        if: ${{ secrets.GENESIS_RUNNER_TOKEN != '' }}
        run: |
          RESP=$(curl --silent --show-error --max-time 20 \
            -X POST \
            -H "Content-Type: application/json" \
            -H "x-genesis-runner-token: ${{ secrets.GENESIS_RUNNER_TOKEN }}" \
            "https://swgixcbwyhxttnmrglbk.supabase.co/functions/v1/genesis-runner" \
            -w "\n%{http_code}" || echo "curl_failed")
          STATUS=$(echo "$RESP" | tail -1)
          echo "genesis-runner response status: $STATUS"
          exit 0

      - name: Run genesis-alerts (Telegram notifications)
        if: ${{ secrets.GENESIS_RUNNER_TOKEN != '' }}
        run: |
          RESP=$(curl --silent --show-error --max-time 20 \
            -X POST \
            -H "Content-Type: application/json" \
            -H "x-genesis-runner-token: ${{ secrets.GENESIS_RUNNER_TOKEN }}" \
            "https://swgixcbwyhxttnmrglbk.supabase.co/functions/v1/genesis-alerts" \
            -w "\n%{http_code}" || echo "curl_failed")
          STATUS=$(echo "$RESP" | tail -1)
          echo "genesis-alerts response status: $STATUS"
          exit 0
