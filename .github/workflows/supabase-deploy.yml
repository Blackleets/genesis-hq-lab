name: Supabase Deploy (migrations + edge functions)

# Despliega el área Solana/PumpFun en la arquitectura serverless:
#  1. Aplica las migraciones SQL contra Postgres usando el secret POSTGRES_URL
#     (que YA existe en el repo) — no requiere credenciales nuevas.
#  2. Despliega las edge functions genesis-runner (feeder pump.fun) y
#     genesis-fallback (rutas de lectura solana-*). Esto requiere UN secret nuevo:
#     SUPABASE_ACCESS_TOKEN (Supabase → Account → Access Tokens). Si no está
#     presente, el paso de deploy se omite y solo corre la migración.

on:
  workflow_dispatch:
  push:
    branches: [feat/genesis-life-os]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - '.github/workflows/supabase-deploy.yml'

permissions:
  contents: read

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

env:
  PROJECT_REF: swgixcbwyhxttnmrglbk
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Los secrets de DB (POSTGRES_URL/DATABASE_URL) viven en el environment
    # Production (creados por la integración de Vercel). Sin esto llegan vacíos.
    environment: Production
    steps:
      - uses: actions/checkout@v4

      # ── 1. Migración SQL (usa POSTGRES_URL existente) ─────────────────────
      - name: Apply SQL migrations
        env:
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PGSSLMODE: require
        run: |
          set -euo pipefail
          CONN="${POSTGRES_URL:-$DATABASE_URL}"
          if [ -z "$CONN" ]; then
            echo "::error::Falta el secret POSTGRES_URL / DATABASE_URL (ambos vacíos para este job)"; exit 1
          fi
          for f in $(ls supabase/migrations/*.sql | sort); do
            echo "── aplicando $f"
            psql "$CONN" -v ON_ERROR_STOP=1 -f "$f"
          done
          echo "Migraciones aplicadas."

      # ── 2. Deploy de edge functions (requiere SUPABASE_ACCESS_TOKEN) ──────
      - name: Setup Supabase CLI
        if: env.SUPABASE_ACCESS_TOKEN != ''
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy genesis-runner (feeder pump.fun)
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: supabase functions deploy genesis-runner --project-ref "$PROJECT_REF" --no-verify-jwt

      - name: Deploy genesis-fallback (rutas de lectura)
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: supabase functions deploy genesis-fallback --project-ref "$PROJECT_REF" --no-verify-jwt

      - name: Aviso si falta el token
        if: env.SUPABASE_ACCESS_TOKEN == ''
        run: |
          echo "::warning::SUPABASE_ACCESS_TOKEN no está configurado: se aplicó la migración pero NO se desplegaron las edge functions."
          echo "Agregá el secret en GitHub → Settings → Secrets and variables → Actions → New repository secret."
