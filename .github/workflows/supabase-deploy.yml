name: Supabase Deploy (edge functions)

# Deploys Genesis Edge Functions via Management API.
# Stable legacy functions keep the body endpoint; bundle-sensitive functions
# use the current multipart deploy endpoint so deno.json travels with source.

on:
  workflow_dispatch:
  push:
    branches: [main, feat/genesis-life-os]
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/supabase-deploy.yml'

permissions:
  contents: read

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

env:
  PROJECT_REF: swgixcbwyhxttnmrglbk
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  GENESIS_RUNNER_TOKEN: ${{ secrets.GENESIS_RUNNER_TOKEN }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  GENESIS_SOLANA_OBSERVER_PUBLIC_KEY: '2V7qrcSqH59hG4BgQdZonefx27uUNyyXCfozDzi1w5zL'

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set secrets on Supabase
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: |
          PAYLOAD="[]"
          if [ -n "$GENESIS_RUNNER_TOKEN" ]; then
            PAYLOAD=$(echo "$PAYLOAD" | python3 -c "import json,sys; d=json.load(sys.stdin); d.append({'name':'GENESIS_RUNNER_TOKEN','value':'$GENESIS_RUNNER_TOKEN'}); print(json.dumps(d))")
          fi
          if [ -n "$TELEGRAM_BOT_TOKEN" ]; then
            PAYLOAD=$(echo "$PAYLOAD" | python3 -c "import json,sys; d=json.load(sys.stdin); d.append({'name':'TELEGRAM_BOT_TOKEN','value':'$TELEGRAM_BOT_TOKEN'}); print(json.dumps(d))")
          fi
          if [ -n "$TELEGRAM_CHAT_ID" ]; then
            PAYLOAD=$(echo "$PAYLOAD" | python3 -c "import json,sys; d=json.load(sys.stdin); d.append({'name':'TELEGRAM_CHAT_ID','value':'$TELEGRAM_CHAT_ID'}); print(json.dumps(d))")
          fi
          if [ -n "$GENESIS_SOLANA_OBSERVER_PUBLIC_KEY" ]; then
            PAYLOAD=$(echo "$PAYLOAD" | python3 -c "import json,sys; d=json.load(sys.stdin); d.append({'name':'GENESIS_SOLANA_OBSERVER_PUBLIC_KEY','value':'$GENESIS_SOLANA_OBSERVER_PUBLIC_KEY'}); print(json.dumps(d))")
          fi
          if [ "$PAYLOAD" != "[]" ]; then
            curl -sf -X POST \
              "https://api.supabase.com/v1/projects/$PROJECT_REF/secrets" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD"
            echo "Supabase secrets updated"
          fi

      - name: Deploy stable functions via legacy Management API
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: |
          deploy_fn() {
            local slug="$1"
            local file="supabase/functions/$slug/index.ts"
            if [ ! -f "$file" ]; then
              echo "::warning::Skipping $slug because $file is not present"
              return 0
            fi
            echo "→ deploying $slug"
            BODY=$(python3 -c "import json; print(json.dumps(open('$file').read()))")
            STATUS=$(curl -s -o /tmp/deploy_out.json -w "%{http_code}" -X PATCH \
              "https://api.supabase.com/v1/projects/$PROJECT_REF/functions/$slug" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"verify_jwt\":false,\"body\":$BODY}")
            if [ "$STATUS" = "404" ]; then
              STATUS=$(curl -s -o /tmp/deploy_out.json -w "%{http_code}" -X POST \
                "https://api.supabase.com/v1/projects/$PROJECT_REF/functions" \
                -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
                -H "Content-Type: application/json" \
                -d "{\"slug\":\"$slug\",\"name\":\"$slug\",\"verify_jwt\":false,\"body\":$BODY}")
            fi
            echo "$slug → HTTP $STATUS: $(cat /tmp/deploy_out.json)"
            [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 300 ]
          }

          deploy_fn genesis-runner
          deploy_fn genesis-fallback
          deploy_fn genesis-alerts
          deploy_fn genesis-solana-observer

      - name: Deploy MEV radar as complete bundle
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: |
          SLUG="genesis-solana-mev-radar"
          DIR="supabase/functions/$SLUG"
          test -f "$DIR/index.ts"
          test -f "$DIR/deno.json"

          echo "→ bundle-deploying $SLUG (index.ts + deno.json)"
          STATUS=$(curl -sS -o /tmp/mev_deploy.json -w "%{http_code}" \
            -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/functions/deploy?slug=$SLUG" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -F 'metadata={"entrypoint_path":"index.ts","name":"genesis-solana-mev-radar","verify_jwt":false}' \
            -F "file=@$DIR/index.ts;filename=index.ts;type=application/typescript" \
            -F "file=@$DIR/deno.json;filename=deno.json;type=application/json")

          echo "$SLUG bundle → HTTP $STATUS: $(cat /tmp/mev_deploy.json)"
          if [ "$STATUS" != "201" ] && [ "$STATUS" != "200" ]; then
            echo "::error::Bundle deploy failed"
            exit 1
          fi

      - name: Smoke-run MEV radar v2 and refresh live state
        if: env.SUPABASE_ACCESS_TOKEN != '' && env.GENESIS_RUNNER_TOKEN != ''
        run: |
          URL="https://$PROJECT_REF.supabase.co/functions/v1/genesis-solana-mev-radar"
          STATUS=000
          for ATTEMPT in 1 2 3; do
            echo "→ MEV radar v2 smoke attempt $ATTEMPT"
            STATUS=$(curl -sS --max-time 150 -o /tmp/mev_radar.json -w "%{http_code}" \
              -X POST "$URL" \
              -H "x-genesis-runner-token: $GENESIS_RUNNER_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{}') || STATUS=000
            if [ "$STATUS" = "200" ]; then
              break
            fi
            echo "Radar returned HTTP $STATUS; retrying after 5s"
            sleep 5
          done

          if [ "$STATUS" != "200" ]; then
            echo "::error::MEV radar v2 did not return HTTP 200 after 3 attempts"
            python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/mev_radar.json')
          print(p.read_text()[:1000] if p.exists() else 'no response body')
          PY
            exit 1
          fi

          python3 - <<'PY'
          import json
          from pathlib import Path

          body = json.loads(Path('/tmp/mev_radar.json').read_text())
          assert body.get('ok') is True, body
          assert body.get('engineVersion') == 'edge_discovery_paper_v2', body.get('engineVersion')
          assert body.get('mode') == 'SHADOW', body.get('mode')
          assert body.get('executionAuthority') is False, body.get('executionAuthority')
          assert body.get('liveLocked') is True, body.get('liveLocked')

          event = body.get('event') or {}
          radar = event.get('radar') or {}
          assert radar.get('engineVersion') == 'edge_discovery_paper_v2', radar.get('engineVersion')
          assert radar.get('notionalGrid') == [10, 25, 50, 100, 250], radar.get('notionalGrid')

          print('MEV_RADAR_V2_OK')
          print('asset=', event.get('asset'))
          print('route=', event.get('route'))
          print('selectedNotionalUsd=', radar.get('selectedNotionalUsd'))
          print('pairAttempts=', radar.get('pairAttempts'))
          print('grossPositiveCount=', radar.get('grossPositiveCount'))
          print('netPositiveCount=', radar.get('netPositiveCount'))
          print('netEdgeBps=', event.get('netEdgeBps'))
          print('expectedNetPnlUsd=', event.get('expectedNetPnlUsd'))
          print('LIVE_LOCKED=', body.get('liveLocked'))
          PY

      - name: Aviso si falta el token
        if: env.SUPABASE_ACCESS_TOKEN == ''
        run: |
          echo "::error::Falta el secret SUPABASE_ACCESS_TOKEN en GitHub Actions."
          exit 1
