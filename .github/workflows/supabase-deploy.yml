name: Supabase Deploy (edge functions)

# Deploys genesis-runner, genesis-fallback, genesis-alerts via Management API
# (bypasses Supabase CLI token format validation for sbp_v0_ tokens).

on:
  workflow_dispatch:
  push:
    branches: [main, feat/genesis-life-os]
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/supabase-deploy.yml'

permissions:
  contents: read

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

env:
  PROJECT_REF: swgixcbwyhxttnmrglbk
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  GENESIS_RUNNER_TOKEN: ${{ secrets.GENESIS_RUNNER_TOKEN }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set secrets on Supabase
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: |
          PAYLOAD="[]"
          if [ -n "$GENESIS_RUNNER_TOKEN" ]; then
            PAYLOAD=$(echo "$PAYLOAD" | python3 -c "import json,sys; d=json.load(sys.stdin); d.append({'name':'GENESIS_RUNNER_TOKEN','value':'$GENESIS_RUNNER_TOKEN'}); print(json.dumps(d))")
          fi
          if [ -n "$TELEGRAM_BOT_TOKEN" ]; then
            PAYLOAD=$(echo "$PAYLOAD" | python3 -c "import json,sys; d=json.load(sys.stdin); d.append({'name':'TELEGRAM_BOT_TOKEN','value':'$TELEGRAM_BOT_TOKEN'}); print(json.dumps(d))")
          fi
          if [ -n "$TELEGRAM_CHAT_ID" ]; then
            PAYLOAD=$(echo "$PAYLOAD" | python3 -c "import json,sys; d=json.load(sys.stdin); d.append({'name':'TELEGRAM_CHAT_ID','value':'$TELEGRAM_CHAT_ID'}); print(json.dumps(d))")
          fi
          if [ "$PAYLOAD" != "[]" ]; then
            curl -sf -X POST \
              "https://api.supabase.com/v1/projects/$PROJECT_REF/secrets" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD"
            echo "Supabase secrets updated"
          fi

      - name: Deploy functions via Management API
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: |
          deploy_fn() {
            local slug="$1"
            local file="supabase/functions/$slug/index.ts"
            echo "→ deploying $slug"
            BODY=$(python3 -c "import json,sys; print(json.dumps(open('$file').read()))")
            # PATCH first (update existing), fall back to POST (create new)
            STATUS=$(curl -s -o /tmp/deploy_out.json -w "%{http_code}" -X PATCH \
              "https://api.supabase.com/v1/projects/$PROJECT_REF/functions/$slug" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"verify_jwt\":false,\"body\":$BODY}")
            if [ "$STATUS" = "404" ]; then
              STATUS=$(curl -s -o /tmp/deploy_out.json -w "%{http_code}" -X POST \
                "https://api.supabase.com/v1/projects/$PROJECT_REF/functions" \
                -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
                -H "Content-Type: application/json" \
                -d "{\"slug\":\"$slug\",\"name\":\"$slug\",\"verify_jwt\":false,\"body\":$BODY}")
            fi
            echo "$slug → HTTP $STATUS: $(cat /tmp/deploy_out.json)"
            [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 300 ]
          }

          deploy_fn genesis-runner
          deploy_fn genesis-fallback
          deploy_fn genesis-alerts

      - name: Aviso si falta el token
        if: env.SUPABASE_ACCESS_TOKEN == ''
        run: |
          echo "::error::Falta el secret SUPABASE_ACCESS_TOKEN en GitHub Actions."
          exit 1
