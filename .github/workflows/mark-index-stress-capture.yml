# RESEARCH_ONLY BTC perpetual mark/index dislocation evidence.
# Public read-only OKX market data; never places orders or changes trading gates.
name: mark-index-stress-capture

on:
  schedule:
    - cron: "4,9,14,19,24,29,34,39,44,49,54,59 * * * *"
  workflow_dispatch:
  push:
    branches: [feat/genesis-life-os]
    paths:
      - .github/workflows/mark-index-stress-capture.yml
      - server/genesis/okxMarkIndexStress.mjs
      - server/tests/okxMarkIndexStress.test.mjs

permissions:
  contents: write

concurrency:
  group: mark-index-stress-capture
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: code
        uses: actions/checkout@v4
      - name: tape
        uses: actions/checkout@v4
        with:
          ref: capture-tape
          path: tape
      - name: verify causal mark-index derivation
        run: node --test server/tests/okxMarkIndexStress.test.mjs
      - name: capture public mark/index stress evidence
        run: node server/genesis/okxMarkIndexStress.mjs --instrument BTC-USDT-SWAP --index BTC-USDT --out tape/paper-tape/mark-index-stress-latest.json --jsonl tape/paper-tape/mark-index-stress.jsonl
      - name: assert RESEARCH_ONLY boundary and provenance
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const x = JSON.parse(fs.readFileSync('tape/paper-tape/mark-index-stress-latest.json', 'utf8'));
          if (x.mode !== 'RESEARCH_ONLY') throw new Error('mode must remain RESEARCH_ONLY');
          if (x.researchUse !== 'OBSERVATIONAL_ONLY_NOT_IN_H1_NOT_FOR_RANKING') throw new Error('ranking boundary missing');
          if (x.interpretation !== 'MARK_INDEX_DISLOCATION_OBSERVATION_ONLY_NOT_DIRECT_LIQUIDATION_COUNT') throw new Error('liquidation-proxy interpretation missing');
          if (x.provenance?.securityType !== 'PUBLIC_READ_ONLY_NO_API_KEY') throw new Error('public read-only provenance missing');
          if (x.boundaries?.liveTradingEnabled !== false || x.boundaries?.realOrdersPlaced !== false) throw new Error('live boundary violated');
          if (x.boundaries?.realTradingConfirmationsChanged !== false || x.boundaries?.riskGatesChanged !== false) throw new Error('trading controls changed');
          if (x.boundaries?.holdoutUsedForRanking !== false || x.boundaries?.forwardPaperPromotion !== false) throw new Error('research promotion boundary violated');
          NODE
      - name: publish durable evidence
        working-directory: tape
        shell: bash
        run: |
          git config user.name "genesis-capture"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f paper-tape/mark-index-stress-latest.json paper-tape/mark-index-stress.jsonl
          if git diff --staged --quiet; then
            echo "no change"
            exit 0
          fi
          git commit -m "mark-index stress capture $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin capture-tape
          git push
