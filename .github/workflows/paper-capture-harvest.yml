# Paper-only OKX harvest. Writes to capture-tape (NOT feat/genesis-life-os)
# so Vercel does not redeploy every tick. Never sends an order.
# Path is paper-tape/ because /data/ is gitignored.
name: paper-capture-harvest
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: code
        uses: actions/checkout@v4
      - name: tape
        uses: actions/checkout@v4
        with:
          ref: capture-tape
          path: tape
      - name: run paper harvest
        run: node server/genesis/harvestWorker.mjs --once --out tape/paper-tape/capture-latest.json --jsonl tape/paper-tape/capture.jsonl
      - name: run 1Hz paper tick
        run: node server/genesis/harvest1hz.mjs --once --out tape/paper-tape/hz1-latest.json --jsonl tape/paper-tape/hz1.jsonl
      - name: publish tape
        working-directory: tape
        run: |
          git config user.name "genesis-capture"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p paper-tape
          git add -f paper-tape/capture-latest.json paper-tape/capture.jsonl paper-tape/hz1-latest.json paper-tape/hz1.jsonl
          if git diff --staged --quiet; then
            echo "no change"
            exit 0
          fi
          git commit -m "paper harvest $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
