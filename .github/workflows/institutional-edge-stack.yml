name: Genesis Institutional Edge Stack

on:
  workflow_dispatch:
  push:
    branches: [feat/genesis-life-os]
    paths:
      - 'src/core/institutionalEdgeAllocator.mjs'
      - 'src/core/institutionalSmartExecution.mjs'
      - 'src/core/solanaLiquidityEconomics.mjs'
      - 'src/core/passiveQueueExecution.mjs'
      - 'server/risk/volatilitySizingEngine.mjs'
      - 'server/crypto/futuresGovernor.mjs'
      - 'server/genesis/runMarketMakingLab.mjs'
      - 'server/genesis/runStatArbLab.mjs'
      - 'server/genesis/runFundingCarryLab.py'
      - 'server/genesis/runFundingCarryLab.mjs'
      - 'server/genesis/runSolanaLiquidityLab.mjs'
      - 'server/genesis/runVolatilitySizingLab.mjs'
      - 'server/genesis/runVolatilitySizingImpactLab.mjs'
      - 'src/core/volatilitySizingImpact.mjs'
      - 'src/core/volatilityNormalizedExit.mjs'
      - 'server/genesis/runVolatilityNormalizedExitLab.mjs'
      - 'server/strategies/futuresBreakoutEngine.mjs'
      - 'server/genesis/runInstitutionalEdgeStack.mjs'
      - 'server/tests/institutionalEdgeAllocator.test.mjs'
      - 'server/tests/institutionalSmartExecution.test.mjs'
      - 'server/tests/solanaLiquidityEconomics.test.mjs'
      - 'server/tests/volatilitySizingEngine.test.mjs'
      - 'server/tests/futuresGovernorRiskEscalation.test.mjs'
      - 'server/tests/volatilitySizingImpact.test.mjs'
      - 'server/tests/volatilityNormalizedExit.test.mjs'
      - 'server/tests/passiveQueueExecution.test.mjs'
      - 'server/tests/test_funding_carry_causality.py'
      - 'server/tests/runFundingCarryLabJsCausality.test.mjs'
      - 'scripts/publicResearchRunSummary.mjs'
      - 'server/tests/publicResearchRunSummary.test.mjs'
      - '.github/workflows/institutional-edge-stack.yml'
  schedule:
    - cron: '17,47 * * * *'

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Restore Solana liquidity forward history
        uses: actions/cache/restore@v4
        with:
          path: quant-evidence/solana-liquidity-history.jsonl
          key: solana-liquidity-v6-history-${{ github.run_id }}
          restore-keys: |
            solana-liquidity-v6-history-
            solana-liquidity-v5-history-
            solana-liquidity-v4-history-

      - name: Safety, allocation and smart-execution tests
        run: node --test server/tests/institutionalEdgeAllocator.test.mjs server/tests/institutionalSmartExecution.test.mjs server/tests/solanaLiquidityEconomics.test.mjs server/tests/volatilitySizingEngine.test.mjs server/tests/volatilitySizingImpact.test.mjs server/tests/volatilityNormalizedExit.test.mjs server/tests/futuresGovernorRiskEscalation.test.mjs server/tests/passiveQueueExecution.test.mjs server/tests/publicResearchRunSummary.test.mjs

      - name: Funding carry causality tests
        run: |
          python3 -m unittest server/tests/test_funding_carry_causality.py
          node --test server/tests/runFundingCarryLabJsCausality.test.mjs

      - name: Market Making Lab — queue-aware passive execution + microprice evidence
        run: node server/genesis/runMarketMakingLab.mjs

      - name: Statistical Arbitrage Lab — walk-forward OOS evidence
        run: node server/genesis/runStatArbLab.mjs

      - name: Funding Carry Lab — Binance Vision delta-neutral OOS
        run: python3 server/genesis/runFundingCarryLab.py

      - name: Solana Liquidity Lab — official DEX fee/TVL + forward stress proxy
        run: node server/genesis/runSolanaLiquidityLab.mjs --history quant-evidence/solana-liquidity-history.jsonl

      - name: Volatility Sizing Lab — model competition and PAPER risk throttle
        run: node server/genesis/runVolatilitySizingLab.mjs

      - name: Volatility Sizing Impact — same trades, all-in counterfactual
        run: node server/genesis/runVolatilitySizingImpactLab.mjs

      - name: Volatility-Normalized Exit Lab — OOS research only
        run: node server/genesis/runVolatilityNormalizedExitLab.mjs

      - name: Institutional Meta Allocator + Smart Execution — PAPER only
        run: node server/genesis/runInstitutionalEdgeStack.mjs

      - name: Verify fail-closed invariants
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const s = JSON.parse(fs.readFileSync('quant-evidence/institutional-edge-stack-latest.json','utf8'));
          const e = s.executionBrain || {};
          const liq = s.sleeves?.find((x) => x.sleeveKey === 'SOLANA_LIQUIDITY');
          const vol = s.volatilitySizing;
          const volImpact = s.volatilitySizingImpact;
          if (s.liveLocked !== true || s.executionAuthority !== false || s.invariants?.paperOnly !== true || s.invariants?.signsTransactions !== false || s.invariants?.broadcastsTransactions !== false) process.exit(1);
          if (e.liveLocked !== true || e.executionAuthority !== false || e.signsTransactions !== false || e.broadcastsTransactions !== false) process.exit(1);
          if (!['MAKE','TAKE','WAIT'].includes(e.action)) process.exit(1);
          if (!Array.isArray(s.sleeves) || !s.sleeves.some((x) => x.sleeveKey === 'FUNDING_CARRY')) process.exit(1);
          if (!liq || liq.liveEligible === true) process.exit(1);
          if (!vol || vol.authority?.direction !== false || vol.authority?.execution !== false || vol.authority?.canIncreaseSize !== false || vol.authority?.paperRiskThrottleOnly !== true) process.exit(1);
          if (!volImpact || volImpact.authority?.direction !== false || volImpact.authority?.execution !== false || volImpact.authority?.canCreateSignals !== false || volImpact.authority?.canIncreaseSize !== false) process.exit(1);
          console.log(JSON.stringify({
            qualifiedSleeves:s.allocation?.qualifiedSleeves,
            cash:s.allocation?.cashReserve?.paperWeight,
            leader:s.nextResearchPriority,
            executionAction:e.action,
            executionExpectedNetBps:e.expectedNetBps,
            fundingCarry:s.sleeves.find((x)=>x.sleeveKey==='FUNDING_CARRY'),
            solanaLiquidity:liq,
            volatilitySizing:{tested:vol.tested,validated:vol.validatedCount,throttled:vol.throttledCount,storms:vol.stormCount},
            volatilitySizingImpact:volImpact.summary,
          }));
          NODE

      - name: Publish public research summary
        run: node scripts/publicResearchRunSummary.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: institutional-edge-stack-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
          path: |
            quant-evidence/market-making-lab-latest.json
            quant-evidence/stat-arb-lab-latest.json
            quant-evidence/funding-carry-lab-latest.json
            quant-evidence/solana-liquidity-lab-latest.json
            quant-evidence/solana-liquidity-history.jsonl
            quant-evidence/volatility-sizing-lab-latest.json
            quant-evidence/volatility-sizing-impact-latest.json
            quant-evidence/volatility-normalized-exit-lab-latest.json
            quant-evidence/institutional-edge-stack-latest.json

      - name: Save Solana liquidity forward history
        uses: actions/cache/save@v4
        with:
          path: quant-evidence/solana-liquidity-history.jsonl
          key: solana-liquidity-v6-history-${{ github.run_id }}
