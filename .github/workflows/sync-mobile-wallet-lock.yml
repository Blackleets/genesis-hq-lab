name: Sync mobile wallet lockfile

on:
  push:
    branches:
      - feat/genesis-life-os
    paths:
      - package.json
      - .github/workflows/sync-mobile-wallet-lock.yml

permissions:
  contents: write

concurrency:
  group: sync-mobile-wallet-lock-feat-genesis-life-os
  cancel-in-progress: true

jobs:
  sync-lockfile:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout canonical branch
        uses: actions/checkout@v4
        with:
          ref: feat/genesis-life-os
          fetch-depth: 0

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Resolve package-lock only
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit synchronized lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(deps): sync mobile wallet lockfile"
          git push origin HEAD:feat/genesis-life-os
