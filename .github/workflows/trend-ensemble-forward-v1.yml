name: Trend Ensemble Forward Confirmation Raw Evidence

on:
  push:
    branches:
      - research/trend-ensemble-forward-v1
    paths:
      - 'research/cross-asset/trend_ensemble_forward_confirmation.py'
      - '.github/workflows/trend-ensemble-forward-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact frozen research commit
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check yfinance pandas numpy

      - name: Execute frozen forward confirmation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research-output/trend-ensemble-forward-v1
          cp research/fx-tsmom/forex_trend_system.py research/cross-asset/forex_trend_system.py
          {
            echo "EVIDENCE_UTC $(date -u +%FT%TZ)"
            echo "EVIDENCE_COMMIT $(git rev-parse HEAD)"
            echo "EVIDENCE_BRANCH ${GITHUB_REF_NAME}"
            python --version
            python - <<'PY'
          import hashlib
          from pathlib import Path
          import numpy, pandas, yfinance
          print('EVIDENCE_VERSIONS', {'numpy':numpy.__version__, 'pandas':pandas.__version__, 'yfinance':yfinance.__version__})
          for p in [
              'research/cross-asset/trend_ensemble_v1.py',
              'research/cross-asset/trend_ensemble_forward_confirmation.py',
              'research/cross-asset/forex_trend_system.py'
          ]:
              print('EVIDENCE_SHA256', p, hashlib.sha256(Path(p).read_bytes()).hexdigest())
          PY
            python -m py_compile research/cross-asset/trend_ensemble_v1.py research/cross-asset/trend_ensemble_forward_confirmation.py research/cross-asset/forex_trend_system.py
            cd research/cross-asset
            python trend_ensemble_forward_confirmation.py
            cd ../..
          } 2>&1 | tee research-output/trend-ensemble-forward-v1/workflow_raw.log
          cp research/cross-asset/trend-ensemble-forward-output/* research-output/trend-ensemble-forward-v1/

      - name: Upload immutable forward evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trend-ensemble-forward-v1-evidence-${{ github.sha }}
          path: |
            research-output/trend-ensemble-forward-v1/**
            research/cross-asset/trend_ensemble_v1.py
            research/cross-asset/trend_ensemble_forward_confirmation.py
            research/cross-asset/forex_trend_system.py
          if-no-files-found: warn
          retention-days: 30
