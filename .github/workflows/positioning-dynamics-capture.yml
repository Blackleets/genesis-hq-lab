# Bounded RESEARCH_ONLY continuity pilot; no schedule, orders or trading-gate edits.
# Isolated per-run tapes avoid overwriting concurrent paper-harvest evidence.
name: positioning-dynamics-capture

on:
  workflow_dispatch:
  pull_request:
    branches: [feat/genesis-life-os]
    paths:
      - .github/workflows/positioning-dynamics-capture.yml
      - server/research/runPositioningContinuity.mjs
      - server/genesis/positioningDynamicsCapture.mjs
      - server/genesis/spotPerpTakerDivergenceCapture.mjs
      - server/tests/positioningContinuity.test.mjs
  push:
    branches: [feat/genesis-life-os]
    paths:
      - .github/workflows/positioning-dynamics-capture.yml
      - .github/genesis/positioning-capture-trigger.txt
      - server/research/runPositioningContinuity.mjs
      - server/genesis/positioningDynamicsCapture.mjs
      - server/genesis/spotPerpTakerDivergenceCapture.mjs
      - server/genesis/okxFixedWindowTaker.mjs
      - server/genesis/derivativesContext.mjs
      - server/research/positioningDataQualityAudit.mjs
      - server/tests/positioningContinuity.test.mjs
      - server/tests/positioningDynamicsCapture.test.mjs
      - server/tests/okxFixedWindowTaker.test.mjs
      - server/tests/derivativesContext.test.mjs
      - server/tests/positioningDataQualityAudit.test.mjs

permissions:
  contents: read

concurrency:
  group: positioning-continuity-${{ github.event.pull_request.number || 'capture' }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: code
        uses: actions/checkout@v4
      - name: node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: verify capture budgets, causal evidence and sealed study
        run: node --test server/tests/positioningContinuity.test.mjs server/tests/positioningDynamicsCapture.test.mjs server/tests/okxFixedWindowTaker.test.mjs server/tests/derivativesContext.test.mjs server/tests/positioningDataQualityAudit.test.mjs server/tests/positioningEdgeFactory.test.mjs server/tests/spotPerpTakerDivergenceCapture.test.mjs
  capture:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'capture:'))
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      GENESIS_TAKER_MAX_PAGES: '50'
      GENESIS_TAKER_PAGE_DELAY_MS: '125'
      GENESIS_CONTINUITY_SESSION: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: code
        uses: actions/checkout@v4
      - name: node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: tape
        uses: actions/checkout@v4
        with:
          ref: capture-tape
          path: tape
      - name: collect bounded public observations and evaluate fixed hypotheses
        id: collect
        timeout-minutes: 32
        run: |
          node server/research/runPositioningContinuity.mjs \
            --session-dir "tape/paper-tape/positioning-continuity-v1/$GENESIS_CONTINUITY_SESSION" \
            --evidence-prefix "paper-tape/positioning-continuity-v1/$GENESIS_CONTINUITY_SESSION" \
            --out tape/quant-evidence/positioning-continuity-latest.json
      - name: assert research-only boundary before publishing complete or partial evidence
        id: boundaries
        if: always() && steps.collect.outcome != 'skipped'
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import { CONTINUITY_PROTOCOL, CONTINUITY_PROTOCOL_SHA256 } from './server/research/runPositioningContinuity.mjs';
          const dir = 'tape/paper-tape/positioning-continuity-v1/' + process.env.GENESIS_CONTINUITY_SESSION;
          const x = JSON.parse(fs.readFileSync(dir + '/session.json', 'utf8'));
          const q = JSON.parse(fs.readFileSync(dir + '/quality.json', 'utf8'));
          const e = JSON.parse(fs.readFileSync(dir + '/study.json', 'utf8'));
          if (x.mode !== 'RESEARCH_ONLY' || !x.paperOnly || x.liveOrders !== false || x.executionAuthority !== false || x.capitalEligible !== false || x.changesRiskGates !== false) throw new Error('session authority boundary violated');
          if (x.protocolSha256 !== CONTINUITY_PROTOCOL_SHA256 || JSON.stringify(x.protocol) !== JSON.stringify(CONTINUITY_PROTOCOL)) throw new Error('predeclared protocol changed');
          if (x.attemptCount > 24 || q.maxGapMinutes !== 60 || q.readiness.minimumIndependentRows !== 20) throw new Error('evidence budget or cohort gate changed');
          if (q.boundaries.holdoutUsedForRanking !== false || q.boundaries.liveTradingEnabled !== false || q.boundaries.realOrdersPlaced !== false) throw new Error('quality authority boundary violated');
          if (e.methodology.holdoutSealed !== true || e.methodology.selectionUsesHoldout !== false || e.methodology.stressedCostBps !== 12) throw new Error('study protocol weakened');
          if (e.executionAuthority !== false || e.capitalEligible !== false || e.liveOrders !== false || e.holdoutOpened === true || e.partitions?.holdoutMetricsComputed === true) throw new Error('study authority or holdout violated');
          NODE
      - name: archive immutable session including failure diagnostics
        if: always() && steps.collect.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: positioning-continuity-${{ env.GENESIS_CONTINUITY_SESSION }}
          path: tape/paper-tape/positioning-continuity-v1/${{ env.GENESIS_CONTINUITY_SESSION }}/
          retention-days: 14
      - name: publish isolated durable evidence
        if: always() && steps.boundaries.outcome == 'success'
        working-directory: tape
        run: |
          git config user.name "genesis-capture"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "paper-tape/positioning-continuity-v1/$GENESIS_CONTINUITY_SESSION" quant-evidence/positioning-continuity-latest.json
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "research: bounded positioning continuity $GENESIS_CONTINUITY_SESSION"
          for attempt in 1 2 3; do
            git pull --rebase origin capture-tape
            if git push origin HEAD:capture-tape; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
