<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Genesis HQ - Agent Learning Demo</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Courier New', monospace;
      background: #0a0a0f;
      color: #e2e8f0;
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
      color: #10b981;
      font-size: 24px;
    }

    .status {
      background: #111827;
      border: 1px solid #10b981;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 20px;
      text-align: center;
    }

    .status.active {
      border-color: #10b981;
      background: rgba(16, 185, 129, 0.05);
    }

    .agents-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .agent-card {
      background: #111827;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 20px;
      transition: all 0.3s ease;
    }

    .agent-card.learning {
      border-color: #10b981;
      box-shadow: 0 0 10px rgba(16, 185, 129, 0.3);
    }

    .agent-name {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 10px;
      color: #10b981;
    }

    .skill-score {
      font-size: 32px;
      font-weight: bold;
      text-align: center;
      margin: 15px 0;
    }

    .skill-bar {
      background: #1f2937;
      height: 8px;
      border-radius: 4px;
      margin-bottom: 10px;
      overflow: hidden;
    }

    .skill-fill {
      height: 100%;
      background: linear-gradient(90deg, #10b981, #06b6d4);
      transition: width 0.3s ease;
    }

    .stats {
      font-size: 12px;
      color: #94a3b8;
      margin-top: 15px;
      border-top: 1px solid #334155;
      padding-top: 10px;
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      margin: 5px 0;
    }

    .trade-feed {
      background: #111827;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 20px;
      max-height: 400px;
      overflow-y: auto;
    }

    .trade-item {
      background: #1f2937;
      padding: 12px;
      margin-bottom: 8px;
      border-radius: 4px;
      border-left: 3px solid #10b981;
      font-size: 12px;
      animation: slideIn 0.3s ease;
    }

    .trade-item.loss {
      border-left-color: #ef4444;
    }

    .trade-item.win {
      border-left-color: #10b981;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateX(-10px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .trade-agent {
      color: #10b981;
      font-weight: bold;
    }

    .trade-pnl {
      margin-top: 5px;
      font-weight: bold;
    }

    .trade-pnl.profit {
      color: #10b981;
    }

    .trade-pnl.loss {
      color: #ef4444;
    }

    .button {
      background: #10b981;
      color: #04110b;
      border: none;
      padding: 12px 24px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      font-family: 'Courier New', monospace;
      margin: 5px;
      transition: all 0.3s ease;
    }

    .button:hover {
      background: #059669;
      box-shadow: 0 0 15px rgba(16, 185, 129, 0.5);
    }

    .button-group {
      text-align: center;
      margin-bottom: 30px;
    }

    .capital-info {
      background: #1f2937;
      border: 1px solid #10b981;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      text-align: center;
    }

    .capital-amount {
      font-size: 28px;
      font-weight: bold;
      color: #10b981;
      margin: 10px 0;
    }

    .learning-status {
      display: inline-block;
      background: #10b981;
      color: #04110b;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🤖 Genesis HQ - Agent Learning System <span class="learning-status">LIVE</span></h1>

    <div class="status active">
      <div>✓ Sistema operacional</div>
      <div>Los agentes están aprendiendo en TIEMPO REAL</div>
      <div style="font-size: 12px; color: #94a3b8; margin-top: 10px;">Actualiza cada trade simulado</div>
    </div>

    <div class="capital-info">
      <div>Capital Inicial</div>
      <div class="capital-amount">$<span id="capital">10,000.00</span></div>
      <div>PnL Total: <span id="totalPnL" style="color: #10b981;">+$0.00</span></div>
    </div>

    <div class="button-group">
      <button class="button" onclick="simulateTrade()">▶ Simular Trade Nuevo</button>
      <button class="button" onclick="simulateMultipleTrades()">▶▶ 5 Trades Rápidos</button>
      <button class="button" onclick="autoSimulate()">🔄 Auto Simular (10s)</button>
      <button class="button" onclick="location.reload()">↻ Resetear</button>
    </div>

    <div style="margin-bottom: 30px;">
      <h2 style="color: #10b981; margin-bottom: 15px;">Agents Learning (Skill Score)</h2>
      <div class="agents-grid" id="agentsContainer"></div>
    </div>

    <div>
      <h2 style="color: #10b981; margin-bottom: 15px;">Recent Trades (Últimos 10)</h2>
      <div class="trade-feed" id="tradeFeed"></div>
    </div>
  </div>

  <script>
    let autoInterval = null;

    async function fetchStatus() {
      try {
        const response = await fetch('/api/learning/demo');
        const data = await response.json();

        if (!data.ok) {
          console.error('Error:', data.error);
          return;
        }

        // Update capital
        document.getElementById('capital').textContent =
          (data.capital.current).toLocaleString('en-US', { minimumFractionDigits: 2 });

        const pnl = data.capital.totalPnL;
        const pnlEl = document.getElementById('totalPnL');
        pnlEl.textContent = `${pnl >= 0 ? '+' : ''}$${pnl.toFixed(2)}`;
        pnlEl.style.color = pnl >= 0 ? '#10b981' : '#ef4444';

        // Update agents
        const agentsContainer = document.getElementById('agentsContainer');
        agentsContainer.innerHTML = data.agents.map(agent => `
          <div class="agent-card learning">
            <div class="agent-name">${agent.name}</div>
            <div class="skill-score" style="color: ${agent.skillScore >= 60 ? '#10b981' : '#fbbf24'}">
              ${agent.skillScore}%
            </div>
            <div class="skill-bar">
              <div class="skill-fill" style="width: ${agent.skillScore}%"></div>
            </div>
            <div class="stats">
              <div class="stat-row">
                <span>Trades:</span>
                <span>${agent.totalTrades}</span>
              </div>
              <div class="stat-row">
                <span>Wins:</span>
                <span style="color: #10b981;">${agent.wins}</span>
              </div>
              <div class="stat-row">
                <span>Losses:</span>
                <span style="color: #ef4444;">${agent.losses}</span>
              </div>
              <div class="stat-row">
                <span>Win Rate:</span>
                <span>${agent.totalTrades > 0 ? ((agent.wins / agent.totalTrades) * 100).toFixed(0) : 0}%</span>
              </div>
            </div>
          </div>
        `).join('');

        // Update trades
        const tradeFeed = document.getElementById('tradeFeed');
        tradeFeed.innerHTML = data.recentTrades.map((trade, i) => `
          <div class="trade-item ${trade.pnl >= 0 ? 'win' : 'loss'}">
            <div><span class="trade-agent">${trade.agentName}</span> - ${trade.market}</div>
            <div class="trade-pnl ${trade.pnl >= 0 ? 'profit' : 'loss'}">
              ${trade.outcome} ${trade.pnl >= 0 ? '+' : ''}$${trade.pnl.toFixed(2)}
              (${(trade.confidence * 100).toFixed(0)}% confianza)
            </div>
            <div style="font-size: 10px; color: #64748b; margin-top: 5px;">
              ${new Date(trade.at).toLocaleTimeString('es-ES')}
            </div>
          </div>
        `).join('');

      } catch (error) {
        console.error('Error fetching status:', error);
      }
    }

    async function simulateTrade() {
      try {
        const response = await fetch('/api/learning/demo', { method: 'POST' });
        const data = await response.json();

        if (data.ok) {
          console.log('Trade ejecutado:', data.trade);
          console.log('Agent learning actualizado:', data.agentLearningUpdated);
          fetchStatus();
        }
      } catch (error) {
        console.error('Error simulando trade:', error);
      }
    }

    async function simulateMultipleTrades() {
      for (let i = 0; i < 5; i++) {
        await new Promise(resolve => setTimeout(resolve, 300));
        await simulateTrade();
      }
    }

    function autoSimulate() {
      if (autoInterval) {
        clearInterval(autoInterval);
        autoInterval = null;
        console.log('Auto simulate detenido');
        return;
      }

      console.log('Auto simulate iniciado - cada 2 segundos');
      autoInterval = setInterval(simulateTrade, 2000);
    }

    // Load initial data
    fetchStatus();
    setInterval(fetchStatus, 5000); // Refresh every 5 seconds
  </script>
</body>
</html>
