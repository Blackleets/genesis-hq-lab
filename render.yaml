# Backend + agente 24/7 en Render (free tier — sin disco persistente).
# Los datos SQLite sobreviven mientras el proceso vive pero se resetean al redeploy.
# Para persistencia real: upgrade a paid tier ($7/mes) y añadir el bloque disk:.
# Conecta el repo en https://dashboard.render.com → New → Blueprint

services:
  - type: web
    name: genesis-hq-backend
    runtime: node
    plan: free
    branch: feat/genesis-life-os
    autoDeploy: true            # redeploy automáticamente en cada push a la branch
    buildCommand: npm install
    startCommand: npm run start:render
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      - key: ANTHROPIC_API_KEY
        sync: false
      # Optimizer footprint tuned for the 512MB free tier (smaller window, less often).
      - key: OPTIMIZER_DAYS
        value: "14"
      - key: OPTIMIZER_INTERVAL_MIN
        value: "120"
